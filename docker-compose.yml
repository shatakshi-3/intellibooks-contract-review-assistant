services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: intellibooks-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: intellibooks
      POSTGRES_PASSWORD: password
      POSTGRES_DB: intellibooks
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
