name: AI Evaluation Benchmark

on:
  workflow_dispatch:
    inputs:
      runType:
        description: "Evaluation Run Type"
        required: true
        default: "full"
        type: choice
        options:
          - full
          - checklist_only
          - quote_only
      modelId:
        description: "Target LLM Model"
        required: false
        default: "google/gemini-2.5-flash"
  schedule:
    # Run every Monday at 06:00 UTC
    - cron: "0 6 * * 1"

jobs:
  evaluate:
    name: Run Benchmark Evaluation
    runs-on: ubuntu-latest
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
      CLERK_SECRET_KEY: sk_test_mock_clerk_secret_key_for_build
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: $(pnpm store path --silent)
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Execute Evaluation Benchmark Suite
        run: pnpm test tests/unit/modules/evaluation.test.ts
